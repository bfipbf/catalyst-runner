name: Jim Silent — Catalyst (read-only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke: runner only; index: private source checkout + parse (never publish)"
        required: true
        type: choice
        options:
          - smoke
          - index
        default: smoke

permissions:
  contents: read

concurrency:
  group: catalyst-readonly
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Python runtime only
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys, xml.etree.ElementTree, json; assert sys.version_info >= (3, 10); print("Jim Silent smoke: PASS")'

  index:
    if: ${{ inputs.mode == 'index' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_READ_TOKEN: ${{ secrets.CATALYST_SOURCE_READ_TOKEN }}
    steps:
      - name: Require configured read-only source credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_READ_TOKEN" ]]; then
            echo "BLOCKED: source read credential is not configured."
            exit 1
          fi
      - name: Checkout public builder (without persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout private source Branch_Gabungan (read-only credential)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: bfi-finance/bfi-pbf-live
          ref: Branch_Gabungan
          token: ${{ secrets.CATALYST_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Parse metadata without displaying source or dependency graph
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/catalyst"
          if ! python3 scripts/catalyst-build.py "$GITHUB_WORKSPACE/private-source" \
               --ref Branch_Gabungan --out "$RUNNER_TEMP/catalyst" \
               > "$RUNNER_TEMP/catalyst.stdout" 2> "$RUNNER_TEMP/catalyst.stderr"; then
            echo "BLOCKED: parser failed; private diagnostics intentionally not printed."
            exit 1
          fi
          if ! python3 scripts/validate-index.py \
               "$GITHUB_WORKSPACE/private-source" "$RUNNER_TEMP/catalyst/catalyst-index.json" \
               > "$RUNNER_TEMP/validation.stdout" 2> "$RUNNER_TEMP/validation.stderr"; then
            echo "BLOCKED: index validation failed; private diagnostics intentionally not printed."
            exit 1
          fi
          echo "Catalyst read-only parsing and coverage checks: PASS."
      - name: Purge temporary source and index from runner
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$RUNNER_TEMP/catalyst" \
            "$RUNNER_TEMP/catalyst.stdout" "$RUNNER_TEMP/catalyst.stderr" \
            "$RUNNER_TEMP/validation.stdout" "$RUNNER_TEMP/validation.stderr"

# Deliberately NO upload-artifact, NO issues/comments, NO publication, NO write token.
# Publication requires a separate reviewed workflow and protected approval environment.
